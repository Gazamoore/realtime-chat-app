<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GazChat</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                margin: 20px
            }

            #messages {
                list-style-type: none;
                padding: 0;
            }
            #messages li {
                padding: 8px;
                background: #eee;
                margin-bottom: 5px;
            }
            #messages li:nth-child(odd){
                background: #ddd;;
            }
        </style>
    </head>
    <body>
        <h1>GazChat</h1>
        <ul id="messages"></ul>
        <form id="form" action="">
            <input id="userInput" placeholder="Username" autocomplete="off"/>
            <input id="messageInput" placeholder="Type your message" autocomplete="off"/>
            <button>Send</button>
        </form>
        <!-- importing socketIO library -->
        <script src="/socket.io/socket.io.js"></script>
        <!-- importing client side logic -->
        <script src="client.js"></script>
    </body>
</html>
